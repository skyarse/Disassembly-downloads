[package]
name = "downloads-triage"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "downloads-triage"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
globset = "0.4"
sha2 = "0.10"
libc = "0.2"
dirs = "6"
fs2 = "0.4"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[dev-dependencies]
tempfile = "3"
